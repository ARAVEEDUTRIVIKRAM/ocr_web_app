<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OCR Tool</title>

  <!-- Bootstrap and Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Dynamic Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="">
  <script>
    const themes = {
      dark: "{{ url_for('static', filename='styles-dark.css') }}",
      light: "{{ url_for('static', filename='styles-light.css') }}",
      futuristic: "{{ url_for('static', filename='styles-futuristic.css') }}"
    };

    function setTheme(theme) {
      localStorage.setItem("theme", theme);
      document.getElementById("theme-style").href = themes[theme];
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme") || "dark";
      setTheme(savedTheme);
      document.getElementById("theme-select").value = savedTheme;
    });
  </script>
</head>
<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-end">
      <!-- 🌈 Theme Selector -->
      <select class="form-select w-auto mb-3" id="theme-select" onchange="setTheme(this.value)">
        <option value="dark">🌌 Dark Neon</option>
        <option value="light">🌤️ Pastel Light</option>
        <option value="futuristic">💫 Futuristic</option>
      </select>
    </div>

    <div class="card shadow-lg">
      <div class="card-header text-center bg-primary text-white">
        <h3><i class="bi bi-file-earmark-text-fill"></i> OCR Tool</h3>
      </div>
      <div class="card-body">
        <form action="/process" method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="imageUpload" class="form-label">Upload Image</label>
            <input id="imageUpload" type="file" class="form-control" name="image" accept="image/*" required>
          </div>

          <div class="mb-3">
            <label for="langSelect" class="form-label">Language</label>
            <select id="langSelect" class="form-select" name="language" required>
              <option value="eng">English</option>
              <option value="hin">Hindi</option>
              <option value="tam">Tamil</option>
              <option value="tel">Telugu</option>
              <option value="kan">Kannada</option>
              <option value="mal">Malayalam</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="preprocessMode" class="form-label">Preprocessing Mode</label>
            <select id="preprocessMode" class="form-select" name="preprocessing_mode">
              <option value="auto">Otsu's (Auto)</option>
              <option value="simple">Simple</option>
              <option value="adaptive">Adaptive</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-eye-fill"></i> Perform OCR
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
