<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OCR Results</title>

  <!-- Bootstrap and Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" />

  <!-- Dynamic Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="">
  <script>
    const themes = {
      dark: "{{ url_for('static', filename='styles-dark.css') }}",
      light: "{{ url_for('static', filename='styles-light.css') }}",
      futuristic: "{{ url_for('static', filename='styles-futuristic.css') }}"
    };

    function setTheme(theme) {
      localStorage.setItem("theme", theme);
      document.getElementById("theme-style").href = themes[theme];
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme") || "dark";
      setTheme(savedTheme);
      document.getElementById("theme-select").value = savedTheme;
    });
  </script>
</head>
<body>
  <div class="container mt-3 d-flex justify-content-end">
    <!-- Theme Switcher -->
    <select class="form-select w-auto" id="theme-select" onchange="setTheme(this.value)">
      <option value="dark">🌌 Dark Neon</option>
      <option value="light">🌤️ Pastel Light</option>
      <option value="futuristic">💫 Futuristic</option>
    </select>
  </div>

  <div class="container mt-4">
    <div class="card shadow-lg">
      <div class="card-header text-center">
        <h3><i class="bi bi-file-check-fill"></i> OCR Results</h3>
      </div>
      <div class="card-body">
        <div class="result-box mb-4">{{ text }}</div>
        <a href="/" class="btn btn-primary">
          <i class="bi bi-arrow-left-circle"></i> Upload Another
        </a>
      </div>
    </div>
  </div>
</body>
</html>
